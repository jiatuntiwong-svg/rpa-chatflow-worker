name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
      PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
      VERIFY_TOKEN: ${{ secrets.VERIFY_TOKEN }}
      FACEBOOK_APP_ID: ${{ vars.FACEBOOK_APP_ID }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION || 'v25.0' }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME || 'rpa-chatflow-uploads' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Prepare Wrangler config
        run: node scripts/prepare-wrangler-config.mjs

      - name: Sync Worker secrets
        run: |
          printf '%s' "$FACEBOOK_APP_SECRET" | npx wrangler secret put FACEBOOK_APP_SECRET
          if [ -n "$PAGE_ACCESS_TOKEN" ]; then
            printf '%s' "$PAGE_ACCESS_TOKEN" | npx wrangler secret put PAGE_ACCESS_TOKEN
          fi

      - name: Apply D1 schema
        run: npx wrangler d1 execute rpa-chatflow-db --remote --file ./schema/schema.sql

      - name: Deploy Worker
        run: npx wrangler deploy
